name: Build MMCV wheel - Win64 Py310 Torch250 CUDA124 sm86

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      MMCV_WITH_OPS: "1"
      FORCE_CUDA: "1"
      TORCH_CUDA_ARCH_LIST: "8.6"
      DISTUTILS_USE_SDK: "1"
      MAX_JOBS: "2"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout MMCV 2.2.0
        uses: actions/checkout@v4
        with:
          repository: open-mmlab/mmcv
          ref: v2.2.0
          path: mmcv-src
          persist-credentials: false

      - name: Create Python 3.10 Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: mmcv-build
          python-version: "3.10"
          auto-update-conda: true

      # CUDA 12.4 requires an older MSVC host compiler than the
      # latest default on windows-2022. Install VS2022 v143 toolset 14.39.
      - name: Install CUDA 12.4-compatible MSVC 14.39 toolset
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio 2022 installation not found' }
          $toolset = Join-Path $vs 'VC\Tools\MSVC'
          if (-not (Get-ChildItem $toolset -Directory -Filter '14.39.*' -ErrorAction SilentlyContinue)) {
            # setup.exe is the supported CLI for modifying an existing VS installation.
            # Do NOT pass --wait here: it is supported by bootstrapper EXEs only.
            $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            if (-not (Test-Path $installer)) { throw "VS setup.exe not found: $installer" }
            $proc = Start-Process -FilePath $installer -ArgumentList @(
              'modify', '--installPath', "`"$vs`"",
              '--add', 'Microsoft.VisualStudio.Component.VC.14.39.17.9.x86.x64',
              '--quiet', '--norestart'
            ) -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              Write-Host "Visual Studio installer exit code: $($proc.ExitCode)"
              # Surface useful installer diagnostics in the GitHub Actions logs.
              Get-ChildItem $env:TEMP -Filter 'dd_*.log' -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending | Select-Object -First 3 |
                ForEach-Object {
                  Write-Host "--- $($_.FullName) (last 40 lines) ---"
                  Get-Content $_.FullName -Tail 40 -ErrorAction SilentlyContinue
                }
              throw "MSVC 14.39 installation failed: $($proc.ExitCode)"
            }
          }
          if (-not (Get-ChildItem $toolset -Directory -Filter '14.39.*' -ErrorAction SilentlyContinue)) {
            throw 'MSVC 14.39 toolset not found after installation'
          }

      - name: Install CUDA Toolkit 12.4.1 (compiler and development libraries, no GPU driver)
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.4.1"
          method: network
          # PyTorch CUDA headers include cusparse.h and may use other CUDA library headers.
          # These *_dev packages are required for compilation, even on GPU-less runners.
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "cusparse", "cusparse_dev", "cusolver", "cusolver_dev", "curand", "curand_dev", "cufft", "cufft_dev", "nvjitlink", "thrust", "nvrtc", "nvrtc_dev", "visual_studio_integration"]'

      - name: Configure CUDA and verify development headers and libraries
        run: |
          if (-not $env:CUDA_PATH) { throw "CUDA_PATH was not set" }
          "CUDA_HOME=$env:CUDA_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$env:CUDA_PATH\bin\nvcc.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "nvcc --version failed" }
          $required = @(
            'include\cuda_runtime.h',
            'include\cublas_v2.h',
            'include\cusparse.h',
            'include\cusolverDn.h',
            'include\curand.h',
            'include\cufft.h',
            'lib\x64\cudart.lib',
            'lib\x64\cublas.lib',
            'lib\x64\cusparse.lib',
            'lib\x64\cusolver.lib'
          )
          foreach ($relPath in $required) {
            $fullPath = Join-Path $env:CUDA_PATH $relPath
            if (-not (Test-Path -LiteralPath $fullPath)) {
              throw "CUDA 12.4 development component missing: $fullPath"
            }
            Write-Host "Found $relPath"
          }

      - name: Install exact PyTorch / torchvision CUDA wheels and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools==69.5.1" wheel ninja psutil packaging "numpy==1.26.4"
          python -m pip install "torch==2.5.0+cu124" "torchvision==0.20.0+cu124" --index-url https://download.pytorch.org/whl/cu124
          python -c "import torch, torchvision; print('torch:', torch.__version__, 'CUDA:', torch.version.cuda); print('torchvision:', torchvision.__version__); assert torch.__version__ == '2.5.0+cu124'; assert torchvision.__version__ == '0.20.0+cu124'; assert torch.version.cuda == '12.4'"

      - name: Build Windows CUDA wheel using Visual Studio 2022
        working-directory: mmcv-src
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'VS2022 C++ toolchain not found' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=amd64 -host_arch=amd64 -vcvars_ver=14.39'
          where.exe cl
          nvcc --version
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir ..\dist -v
          if ($LASTEXITCODE -ne 0) { throw 'MMCV wheel build failed' }

      - name: Verify compiled extension is inside the wheel
        run: |
          $wheel = Get-ChildItem -Path dist -Filter 'mmcv-*.whl' | Select-Object -First 1
          if (-not $wheel) { throw 'No MMCV wheel produced' }
          $env:MMCV_WHEEL = $wheel.FullName
          python -c "import os, zipfile; z = zipfile.ZipFile(os.environ['MMCV_WHEEL']); ops = [n for n in z.namelist() if n.startswith('mmcv/_ext') and n.endswith('.pyd')]; print('Compiled MMCV extension:', ops); assert ops, 'The wheel is missing the compiled MMCV ops extension'"
          Write-Host "Built: $($wheel.Name)"

      # A Python wheel cannot embed other wheels as installable dependencies.
      # Create a separate, self-contained wheelhouse for offline Windows/Python 3.10 installs.
      - name: Download complete offline dependency wheelhouse
        run: |
          New-Item -ItemType Directory -Path wheelhouse -Force | Out-Null
          $mmcv = Get-ChildItem -Path dist -Filter 'mmcv-2.2.0-cp310-cp310-win_amd64.whl' | Select-Object -First 1
          if (-not $mmcv) { throw 'MMCV cp310 win_amd64 wheel is missing' }

          # Download using this Windows/Python 3.10 environment, not the host OS
          # of the user's future installation. --only-binary prevents sdists.
          # Explicit torch/torchvision pins stop the resolver upgrading to a
          # different CUDA build when it resolves transitive dependencies.
          python -m pip download `
            --dest wheelhouse `
            --only-binary=:all: `
            --timeout 120 `
            --retries 10 `
            --extra-index-url https://download.pytorch.org/whl/cu124 `
            $mmcv.FullName `
            'numpy==1.26.4' `
            'torch==2.5.0+cu124' `
            'torchvision==0.20.0+cu124'
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the full dependency wheelhouse' }

          # Require all the essential wheels in the actual upload directory.
          foreach ($pkg in @('mmcv-', 'mmengine-', 'torch-', 'torchvision-', 'numpy-')) {
            if (-not (Get-ChildItem wheelhouse -Filter "$pkg*.whl" | Select-Object -First 1)) {
              throw "No $pkg wheel in offline bundle"
            }
          }
          Write-Host 'Offline wheelhouse packages:'
          Get-ChildItem wheelhouse -Filter '*.whl' | Sort-Object Name | Select-Object Name, Length | Format-Table -AutoSize

      - name: Check offline wheelhouse resolution
        run: |
          # Ignore already-installed runner packages: verify that the bundle
          # really contains all dependencies needed on another Windows PC.
          $mmcv = Get-ChildItem wheelhouse -Filter 'mmcv-2.2.0-cp310-cp310-win_amd64.whl' | Select-Object -First 1
          if (-not $mmcv) { throw 'MMCV wheel not found in wheelhouse' }
          python -m pip install --dry-run --ignore-installed `
            --no-index --find-links wheelhouse `
            $mmcv.FullName `
            'numpy==1.26.4' `
            'torch==2.5.0+cu124' `
            'torchvision==0.20.0+cu124'
          if ($LASTEXITCODE -ne 0) { throw 'Offline bundle is incomplete' }

      - name: Write offline installation script
        run: |
          $installer = @'
          param([string]$Python = 'python')
          $ErrorActionPreference = 'Stop'
          $wheelhouse = Join-Path $PSScriptRoot 'wheelhouse'
          if (-not (Test-Path -LiteralPath $wheelhouse)) {
              throw "Missing wheelhouse directory: $wheelhouse"
          }
          $mmcv = Get-ChildItem -LiteralPath $wheelhouse -Filter 'mmcv-2.2.0-cp310-cp310-win_amd64.whl' | Select-Object -First 1
          if (-not $mmcv) { throw 'MMCV wheel not found in wheelhouse' }
          Write-Host 'Installing MMCV and all dependencies without contacting PyPI...'
          & $Python -m pip install --no-index --find-links "$wheelhouse" `
              'numpy==1.26.4' 'torch==2.5.0+cu124' 'torchvision==0.20.0+cu124' $mmcv.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Offline installation failed' }
          & $Python -m pip check
          if ($LASTEXITCODE -ne 0) { Write-Warning 'pip check found environment conflicts; review the output above' }
          & $Python -c "import torch, torchvision, mmcv, mmcv._ext; print('torch:', torch.__version__, 'CUDA:', torch.version.cuda); print('torchvision:', torchvision.__version__); print('mmcv:', mmcv.__version__); print('MMCV extension import: OK')"
          if ($LASTEXITCODE -ne 0) { throw 'MMCV import verification failed' }
          '@
          Set-Content -Path install-offline.ps1 -Value $installer -Encoding UTF8

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: mmcv-2.2.0-win_amd64-py310-torch250-cu124-sm86
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

      - name: Upload offline bundle (MMCV + all required wheels + installer)
        uses: actions/upload-artifact@v4
        with:
          name: mmcv-2.2.0-win_amd64-py310-torch250-cu124-sm86-OFFLINE
          path: |
            wheelhouse/
            install-offline.ps1
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
